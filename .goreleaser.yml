version: 2

project_name: vessel

before:
  hooks:
    - go mod tidy

builds:
  - id: vessel
    main: .
    binary: vessel
    goos:
      - darwin
    goarch:
      # Apple's container CLI is Apple-silicon only; see README requirements.
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: vessel
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: attentionfs
    name: vessel
  draft: false
  prerelease: auto

brews:
  - name: vessel
    directory: Formula
    repository:
      owner: attentionfs
      name: homebrew-vessel
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/attentionfs/vessel"
    description: "A keyboard-driven TUI for Apple's native Mac containers"
    license: "MIT"
    install: |
      bin.install "vessel"
    test: |
      system "#{bin}/vessel", "--version"
